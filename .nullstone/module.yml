name: aws-packer-builder-github
friendly_name: Packer Builder (AWS via GitHub)
description: |
  Configures an AWS account to perform packer builds.
  This creates an IAM role and GitHub OIDC trust so GitHub Actions can bake AMIs with Packer in an AWS account.
  Outputs the role ARN, region, AMI copy regions, and org launch ARNs for the bake workflow to consume.
